[package]
name = "limen-vault"
version = "0.5.0"
description = "LIMEN Vault Desktop macOS Application"
authors = ["LIMEN"]
edition = "2021"
default-run = "limen-vault"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.1.1", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
urlencoding = "2.1"
serde_yaml = "0.9"
cap-std = "4"
libc = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sha2 = "0.10"
regex = "1"
unicode-normalization = "0.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tiny_http = "0.12"
tokio = { version = "1", features = ["time", "macros"] }
getrandom = "0.3"
calamine = "0.26"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
quick-xml = "0.31"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO"] }

[dev-dependencies]
tempfile = "3"


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
